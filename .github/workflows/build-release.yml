name: Build & Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build, Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install build dependencies
        run: |
          for i in 1 2 3; do npm ci && break || ([ $i -lt 3 ] && sleep 15) || exit 1; done

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update plugin version in PHP header
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          sed -i "s/^\( \* Version:\s*\).*/\1${VERSION}/" aiwa-identity-animation.php
          sed -i "s/define( 'AIWA_IDENTITY_ANIMATION_VERSION', '[^']*' )/define( 'AIWA_IDENTITY_ANIMATION_VERSION', '${VERSION}' )/" aiwa-identity-animation.php
          sed -i "s/^\*\*Version:\*\* .*/\*\*Version:\*\* ${VERSION}/" README.md

      - name: Build block assets
        run: npm run build

      - name: Create release archive
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PLUGIN_SLUG="aiwa-identity-animation"
          ARCHIVE="${PLUGIN_SLUG}-${VERSION}.zip"

          STAGING="/tmp/${PLUGIN_SLUG}"
          rm -rf "${STAGING}"
          mkdir -p "${STAGING}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='vendor/' \
            --exclude='src/' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='phpcs.xml' \
            --exclude='phpstan.neon' \
            --exclude='*.zip' \
            . "${STAGING}/"

          ROOT="$PWD"
          cd /tmp
          zip -r "${ROOT}/${ARCHIVE}" "${PLUGIN_SLUG}"
          cd "$ROOT"

          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Generate SHA256 checksum
        run: |
          sha256sum "${{ env.ARCHIVE }}" > "${{ env.ARCHIVE }}.sha256"
          echo "SHA256=$(cat "${{ env.ARCHIVE }}.sha256")" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: "AiWA Identity Animation v${{ steps.version.outputs.VERSION }}"
          body: |
            ## AiWA Identity Animation v${{ steps.version.outputs.VERSION }}

            ### Installation
            Download `${{ env.ARCHIVE }}` and install via **Plugins → Add New → Upload Plugin** in your WordPress admin.

            ### SHA256 Checksum
            ```
            ${{ env.SHA256 }}
            ```
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          draft: false
          prerelease: false
